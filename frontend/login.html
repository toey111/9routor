<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดเก็บข้อมูลบุคลากร คณะเทคโนโลยีสารสนเทศ มรภ.ร้อยเอ็ด</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
        };
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        const theme = localStorage.getItem("theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
    </script>
</head>
<body class="login-page min-h-screen flex items-center justify-center p-4">

    <!-- Theme Toggle Floating Button -->
    <button id="login-theme-toggle" type="button" class="theme-toggle-btn" aria-label="สลับโหมดเช้า/โหมดมืด" style="position:fixed; top:1.25rem; right:1.25rem; z-index:50;">
        <span class="theme-state-icon theme-icon-light"><i data-lucide="sun" class="w-4 h-4"></i></span>
        <span class="theme-state-icon theme-icon-dark"><i data-lucide="moon" class="w-4 h-4"></i></span>
        <span class="theme-toggle-label">โหมดเช้า</span>
    </button>

    <div class="login-shell max-w-md w-full my-8">
        <span class="login-orb login-orb-one"></span>
        <span class="login-orb login-orb-two"></span>

        <!-- Logo & Header Minimalist -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-bold text-2xl shadow-lg mb-3 border border-white/20">
                IT
            </div>
            <h1 class="text-xl lg:text-2xl font-bold text-white tracking-tight">ระบบจัดเก็บข้อมูลบุคลากร</h1>
            <p class="text-xs text-slate-300 mt-1">คณะเทคโนโลยีสารสนเทศ มหาวิทยาลัยราชภัฏร้อยเอ็ด</p>
        </div>

        <!-- Login Form Card -->
        <div class="login-card rounded-2xl p-7 shadow-2xl backdrop-blur-xl">
            <div class="mb-5 pb-3 border-b border-slate-100 dark:border-slate-800">
                <h2 class="text-sm font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i data-lucide="lock" class="w-4 h-4 text-blue-500"></i>
                    เข้าสู่ระบบด้วยบัญชีผู้ใช้
                </h2>
                <p class="text-xs text-slate-400 mt-0.5">กรุณากรอกชื่อผู้ใช้งานและรหัสผ่านเพื่อเข้าใช้งาน</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">ชื่อผู้ใช้หรืออีเมล</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                        <input type="text" id="username" required
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border text-xs focus:ring-2 focus:ring-blue-500/20 outline-none"
                            placeholder="เช่น admin, executive หรือ staff">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">รหัสผ่าน</label>
                    <div class="relative">
                        <i data-lucide="key" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                        <input type="password" id="password" required
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border text-xs focus:ring-2 focus:ring-blue-500/20 outline-none"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-sm transition-all text-xs flex items-center justify-center gap-2 mt-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>เข้าสู่ระบบ</span>
                </button>
            </form>

            <!-- Quick Demo Role Switcher -->
            <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-800">
                <p class="text-[11px] font-semibold text-slate-400 text-center uppercase tracking-wider mb-2.5">
                    บัญชีทดสอบด่วน (Quick Demo)
                </p>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="fillDemo('admin', 'admin123')" type="button"
                        class="demo-button p-2 rounded-xl text-center text-xs transition-all">
                        <span class="block text-blue-500 font-bold text-[11px]">Admin</span>
                        <span class="text-[10px] text-slate-500 dark:text-slate-400">ผู้ดูแลระบบ</span>
                    </button>
                    <button onclick="fillDemo('executive', 'exec123')" type="button"
                        class="demo-button p-2 rounded-xl text-center text-xs transition-all">
                        <span class="block text-indigo-500 font-bold text-[11px]">Executive</span>
                        <span class="text-[10px] text-slate-500 dark:text-slate-400">ผู้บริหาร</span>
                    </button>
                    <button onclick="fillDemo('staff', 'staff123')" type="button"
                        class="demo-button p-2 rounded-xl text-center text-xs transition-all">
                        <span class="block text-emerald-500 font-bold text-[11px]">Staff</span>
                        <span class="text-[10px] text-slate-500 dark:text-slate-400">บุคลากร</span>
                    </button>
                </div>
            </div>
        </div>

        <p class="text-center text-[11px] text-slate-400 mt-5">
            © 2026 Faculty of Information Technology, Roi Et Rajabhat University.
        </p>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/components.js"></script>
    <script>
        /* global auth, apiClient, ui, lucide, getStoredTheme */
        function resetLoginButtonState() {
            const btn = document.getElementById("submit-btn");
            if (!btn) return;
            btn.removeAttribute("disabled");
            btn.innerHTML = `
                <i data-lucide="log-in" class="w-4 h-4"></i>
                <span>เข้าสู่ระบบ</span>
            `;
            if (typeof lucide !== "undefined" && lucide.createIcons) {
                lucide.createIcons();
            }
        }

        function applyLoginTheme(theme) {
            const normalizedTheme = theme === "dark" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", normalizedTheme);
            if (document.body) document.body.setAttribute("data-theme", normalizedTheme);
            try {
                localStorage.setItem("theme", normalizedTheme);
            } catch (e) {
                console.warn(e);
            }

            const toggleBtn = document.getElementById("login-theme-toggle");
            if (toggleBtn) {
                toggleBtn.classList.toggle("is-dark", normalizedTheme === "dark");
                toggleBtn.setAttribute("aria-label", normalizedTheme === "dark" ? "สลับเป็นโหมดสว่าง" : "สลับเป็นโหมดมืด");

                const label = toggleBtn.querySelector(".theme-toggle-label");
                if (label) {
                    label.textContent = normalizedTheme === "dark" ? "โหมดมืด" : "โหมดสว่าง";
                }
            }

            if (typeof lucide !== "undefined" && window.lucide && window.lucide.createIcons) {
                window.lucide.createIcons();
            }
        }

        applyLoginTheme(typeof getStoredTheme === "function" ? getStoredTheme() : "light");
        resetLoginButtonState();

        const loginThemeToggle = document.getElementById("login-theme-toggle");
        if (loginThemeToggle) {
            loginThemeToggle.addEventListener("click", () => {
                const currentTheme = (document.body && document.body.getAttribute("data-theme")) || "light";
                const nextTheme = currentTheme === "dark" ? "light" : "dark";
                applyLoginTheme(nextTheme);
            });
        }

        window.addEventListener("pageshow", resetLoginButtonState);

        function fillDemo(user, pass) {
            const userInput = document.getElementById("username");
            const passInput = document.getElementById("password");
            if (userInput) userInput.value = user;
            if (passInput) passInput.value = pass;
            if (typeof ui !== "undefined" && ui.showToast) {
                ui.showToast(`กรอกข้อมูลทดสอบ: ${user}`, "info", 1800);
            }
        }

        // Check if redirected from expired token
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("expired") && typeof ui !== "undefined" && ui.showToast) {
            ui.showToast("เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่อีกครั้ง", "warning");
        }

        const loginForm = document.getElementById("login-form");
        if (loginForm) {
            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                const userInput = document.getElementById("username");
                const passInput = document.getElementById("password");
                const username = userInput ? userInput.value.trim() : "";
                const password = passInput ? passInput.value.trim() : "";

                if (!username) {
                    if (typeof ui !== "undefined" && ui.highlightError) {
                        ui.highlightError("username", "กรุณากรอกชื่อผู้ใช้งาน");
                    }
                    return;
                }
                if (!password) {
                    if (typeof ui !== "undefined" && ui.highlightError) {
                        ui.highlightError("password", "กรุณากรอกรหัสผ่าน");
                    }
                    return;
                }

                const btn = document.getElementById("submit-btn");
                if (!btn) return;
                const originalText = btn.innerHTML;
                btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังเข้าสู่ระบบ...`;
                btn.setAttribute("disabled", "true");

                try {
                    if (typeof apiClient === "undefined") throw new Error("API Client not loaded");
                    const data = await apiClient.post("/auth/login", { username, password });
                    if (typeof auth !== "undefined" && auth.setUserSession) auth.setUserSession(data);
                    if (typeof ui !== "undefined" && ui.showToast) {
                        ui.showToast(`ยินดีต้อนรับ ${data.full_name || data.username}`, "success");
                    }

                    setTimeout(() => {
                        if (data.role === "STAFF") {
                            window.location.href = data.personnel_id ? `personnel-detail.html?id=${data.personnel_id}` : "personnel-list.html";
                        } else {
                            window.location.href = "dashboard.html";
                        }
                    }, 600);
                } catch (err) {
                    if (typeof ui !== "undefined" && ui.showToast) {
                        ui.showToast(err.message, "error");
                    }
                    btn.innerHTML = originalText;
                    btn.removeAttribute("disabled");
                    if (typeof lucide !== "undefined" && lucide.createIcons) {
                        lucide.createIcons();
                    }
                }
            });
        }

        if (typeof lucide !== "undefined" && window.lucide) {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
