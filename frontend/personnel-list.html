<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายชื่อบุคลากร - คณะเทคโนโลยีสารสนเทศ มรภ.ร้อยเอ็ด</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
        };
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        const theme = localStorage.getItem("theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
    </script>
</head>
<body class="min-h-screen flex">

    <!-- Sidebar Container -->
    <aside id="sidebar" class="w-64 fixed inset-y-0 left-0 z-40 hidden lg:block transition-all"></aside>

    <!-- Main Content Area -->
    <div class="flex-1 lg:ml-64 flex flex-col min-h-screen">
        <header id="header"></header>

        <main class="p-6 lg:p-8 flex-1 max-w-7xl w-full mx-auto space-y-6">

            <!-- Page Title & Actions -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-xl lg:text-2xl font-bold text-slate-800 dark:text-slate-100 tracking-tight">รายชื่อและข้อมูลบุคลากร</h1>
                    <p class="text-xs text-slate-400 mt-0.5">ค้นหา ตรวจสอบ จัดการ และออกรายงานข้อมูลบุคลากรประจำคณะ</p>
                </div>

                <div class="flex items-center gap-2 flex-wrap">
                    <!-- Export Dropdown -->
                    <div class="relative" id="export-dropdown">
                        <button id="export-toggle" type="button" aria-expanded="false" class="px-3.5 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold shadow-xs transition-all flex items-center gap-2">
                            <i data-lucide="download" class="w-4 h-4 text-slate-400"></i>
                            <span>ส่งออกรายงาน</span>
                            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
                        </button>
                        <div id="export-menu" class="absolute right-0 mt-1.5 w-44 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1.5 hidden z-30">
                            <button type="button" onclick="exportData('excel')" class="w-full px-3.5 py-2 text-left text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-blue-50 dark:hover:bg-slate-700 hover:text-blue-600 flex items-center gap-2">
                                <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-500"></i>
                                Excel (.xlsx)
                            </button>
                            <button type="button" onclick="exportData('csv')" class="w-full px-3.5 py-2 text-left text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-blue-50 dark:hover:bg-slate-700 hover:text-blue-600 flex items-center gap-2">
                                <i data-lucide="file-text" class="w-4 h-4 text-blue-500"></i>
                                CSV (.csv UTF-8)
                            </button>
                            <button type="button" onclick="exportData('pdf')" class="w-full px-3.5 py-2 text-left text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-blue-50 dark:hover:bg-slate-700 hover:text-blue-600 flex items-center gap-2">
                                <i data-lucide="file" class="w-4 h-4 text-rose-500"></i>
                                PDF Document
                            </button>
                        </div>
                    </div>

                    <!-- Add Button (Admin Only) -->
                    <a id="btn-add-personnel" href="personnel-form.html" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-sm transition-all flex items-center gap-2">
                        <i data-lucide="user-plus" class="w-4 h-4"></i>
                        <span>เพิ่มบุคลากรใหม่</span>
                    </a>
                </div>
            </div>

            <!-- Search & Filters Bar Card -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <!-- Search Input -->
                    <div class="relative lg:col-span-2">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-2.5"></i>
                        <input type="text" id="search-input" placeholder="ค้นหาชื่อ, สกุล, รหัสบุคลากร, อีเมล..."
                            class="w-full pl-10 pr-4 py-2 border rounded-xl text-xs outline-none">
                    </div>

                    <!-- Filter Branch -->
                    <div>
                        <select id="filter-branch" class="w-full px-3 py-2 border rounded-xl text-xs outline-none">
                            <option value="">ทุกสาขาวิชา / หน่วยงาน</option>
                        </select>
                    </div>

                    <!-- Filter Status -->
                    <div>
                        <select id="filter-status" class="w-full px-3 py-2 border rounded-xl text-xs outline-none">
                            <option value="">ทุกสถานะการทำงาน</option>
                            <option value="ปฏิบัติงาน">ปฏิบัติงาน</option>
                            <option value="ลาศึกษาต่อ">ลาศึกษาต่อ</option>
                            <option value="ลาออก">ลาออก</option>
                            <option value="เกษียณ">เกษียณ</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Data Table Card -->
            <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-xs">
                <div class="overflow-x-auto">
                    <table class="w-full text-left min-w-[760px]">
                        <thead>
                            <tr class="border-b text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                <th class="py-3 px-4 text-center w-12">#</th>
                                <th class="py-3 px-4">บุคลากร</th>
                                <th class="py-3 px-4">ตำแหน่ง / สังกัด</th>
                                <th class="py-3 px-4">ประเภทบุคลากร</th>
                                <th class="py-3 px-4">การติดต่อ</th>
                                <th class="py-3 px-4 text-center">สถานะ</th>
                                <th class="py-3 px-4 text-right">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="personnel-table-body" class="divide-y divide-slate-100 dark:divide-slate-800 text-xs">
                            <tr>
                                <td colspan="7" class="py-12 text-center text-slate-400">
                                    <i data-lucide="loader" class="w-6 h-6 animate-spin mx-auto mb-2 text-blue-600"></i>
                                    กำลังโหลดข้อมูล...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Footer -->
                <div class="px-6 py-3.5 border-t border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400">
                    <div id="pagination-info">แสดงรายการ 0 จาก 0 รายการ</div>
                    <div class="flex items-center gap-1" id="pagination-controls"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/components.js"></script>
    <script>
        /* global auth, apiClient, ui, lucide, renderLayout */
        const role = typeof auth !== "undefined" && auth.getRole ? auth.getRole() : "";

        if (typeof auth !== "undefined" && auth.requireAuth && auth.requireAuth(["ADMIN", "EXECUTIVE"])) {
            renderLayout("personnel");
            initPersonnelList();
        }

        let currentPage = 1;
        let searchTimeout = null;

        async function initPersonnelList() {
            if (role !== "ADMIN") {
                const addBtn = document.getElementById("btn-add-personnel");
                if (addBtn) addBtn.style.display = "none";
            }

            initExportDropdown();
            await loadMasterFilters();
            await loadPersonnel(1);

            const searchInp = document.getElementById("search-input");
            if (searchInp) {
                searchInp.addEventListener("input", () => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        currentPage = 1;
                        loadPersonnel(currentPage);
                    }, 350);
                });
            }

            const filterBr = document.getElementById("filter-branch");
            if (filterBr) {
                filterBr.addEventListener("change", () => {
                    currentPage = 1;
                    loadPersonnel(currentPage);
                });
            }

            const filterSt = document.getElementById("filter-status");
            if (filterSt) {
                filterSt.addEventListener("change", () => {
                    currentPage = 1;
                    loadPersonnel(currentPage);
                });
            }
        }

        function initExportDropdown() {
            const exportDropdown = document.getElementById("export-dropdown");
            const exportToggle = document.getElementById("export-toggle");
            const exportMenu = document.getElementById("export-menu");

            if (!exportDropdown || !exportToggle || !exportMenu) return;

            const setExportMenuState = (isOpen) => {
                exportMenu.classList.toggle("hidden", !isOpen);
                exportToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
            };

            exportToggle.addEventListener("click", (event) => {
                event.stopPropagation();
                const isOpen = !exportMenu.classList.contains("hidden");
                setExportMenuState(!isOpen);
            });

            exportMenu.querySelectorAll("button").forEach((item) => {
                item.addEventListener("click", () => setExportMenuState(false));
            });

            document.addEventListener("click", (event) => {
                if (!exportDropdown.contains(event.target)) {
                    setExportMenuState(false);
                }
            });

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    setExportMenuState(false);
                }
            });
        }

        async function loadMasterFilters() {
            try {
                const branches = await apiClient.get("/branches");
                const branchSelect = document.getElementById("filter-branch");
                if (branchSelect && Array.isArray(branches)) {
                    branches.forEach(b => {
                        const opt = document.createElement("option");
                        opt.value = b.id;
                        opt.textContent = b.name;
                        branchSelect.appendChild(opt);
                    });
                }
            } catch (e) {
                console.error("Filter load error", e);
            }
        }

        async function loadPersonnel(page = 1) {
            currentPage = page;
            const searchEl = document.getElementById("search-input");
            const branchEl = document.getElementById("filter-branch");
            const statusEl = document.getElementById("filter-status");

            const search = searchEl ? searchEl.value.trim() : "";
            const branch_id = branchEl ? branchEl.value : "";
            const work_status = statusEl ? statusEl.value : "";

            const tbody = document.getElementById("personnel-table-body");
            if (tbody) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="py-12 text-center text-slate-400">
                            <i data-lucide="loader" class="w-6 h-6 animate-spin mx-auto mb-2 text-blue-500"></i>
                            กำลังโหลดข้อมูล...
                        </td>
                    </tr>
                `;
            }
            if (typeof lucide !== "undefined" && lucide.createIcons) lucide.createIcons();

            try {
                const res = await apiClient.get("/personnel", {
                    page: currentPage,
                    page_size: 10,
                    search,
                    branch_id,
                    work_status
                });

                if (!tbody) return;

                if (!res.items || res.items.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="py-12 text-center text-slate-400">
                                <i data-lucide="users" class="w-8 h-8 mx-auto mb-2 text-slate-400 opacity-60"></i>
                                ไม่พบข้อมูลบุคลากรตามเงื่อนไขที่ระบุ
                            </td>
                        </tr>
                    `;
                    const infoEl = document.getElementById("pagination-info");
                    if (infoEl) infoEl.innerText = "ไม่พบรายการ";
                    const pagEl = document.getElementById("pagination-controls");
                    if (pagEl) pagEl.innerHTML = "";
                    if (typeof lucide !== "undefined" && lucide.createIcons) lucide.createIcons();
                    return;
                }

                tbody.innerHTML = res.items.map((item, idx) => {
                    const avatarSrc = item.avatar_url || 'images/default-avatar-white.svg';
                    const statusBadge = item.work_status === 'ปฏิบัติงาน' 
                        ? `<span class="px-2 py-0.5 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/50 rounded-full font-semibold text-[10px]">ปฏิบัติงาน</span>`
                        : `<span class="px-2 py-0.5 bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800/50 rounded-full font-semibold text-[10px]">${item.work_status}</span>`;

                    let actionButtons = `
                        <a href="personnel-detail.html?id=${item.id}" class="p-1.5 text-slate-500 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-slate-800 rounded-lg transition-colors" title="ดูข้อมูล">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </a>
                    `;

                    if (role === "ADMIN") {
                        actionButtons += `
                            <a href="personnel-form.html?id=${item.id}" class="p-1.5 text-slate-500 hover:text-indigo-500 hover:bg-indigo-50 dark:hover:bg-slate-800 rounded-lg transition-colors" title="แก้ไข">
                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                            </a>
                            <button type="button" onclick="confirmDelete(${item.id}, '${item.full_name_th}')" class="p-1.5 text-slate-500 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-slate-800 rounded-lg transition-colors" title="ลบ">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        `;
                    }

                    return `
                        <tr class="transition-colors">
                            <td class="py-3 px-4 text-center text-slate-400 font-mono">${(res.page - 1) * res.page_size + idx + 1}</td>
                            <td class="py-3 px-4">
                                <div class="flex items-center gap-3">
                                    <img src="${avatarSrc}" alt="${item.full_name_th}" class="w-9 h-9 rounded-full object-cover border border-slate-200 dark:border-slate-700">
                                    <div>
                                        <a href="personnel-detail.html?id=${item.id}" class="font-bold text-slate-800 dark:text-slate-100 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">${item.full_name_th}</a>
                                        <p class="text-[11px] font-mono text-slate-400">${item.personnel_code}</p>
                                    </div>
                                </div>
                            </td>
                            <td class="py-3 px-4">
                                <p class="font-medium text-slate-800 dark:text-slate-200">${item.position_name || '-'}</p>
                                <p class="text-[11px] text-slate-400">${item.branch_name || '-'}</p>
                            </td>
                            <td class="py-3 px-4 text-slate-600 dark:text-slate-300">
                                ${item.personnel_type_name || '-'}
                            </td>
                            <td class="py-3 px-4">
                                <p class="text-slate-700 dark:text-slate-200">${item.email}</p>
                                <p class="text-[11px] text-slate-400">${item.phone || '-'}</p>
                            </td>
                            <td class="py-3 px-4 text-center">
                                ${statusBadge}
                            </td>
                            <td class="py-3 px-4 text-right">
                                <div class="flex items-center justify-end gap-0.5">
                                    ${actionButtons}
                                </div>
                            </td>
                        </tr>
                    `;
                }).join("");

                const infoEl = document.getElementById("pagination-info");
                if (infoEl) infoEl.innerText = `แสดงรายการ ${(res.page - 1) * res.page_size + 1} - ${Math.min(res.page * res.page_size, res.total)} จากทั้งหมด ${res.total} รายการ`;
                renderPagination(res.page, res.total_pages);
                if (typeof lucide !== "undefined" && lucide.createIcons) lucide.createIcons();

            } catch (err) {
                if (tbody) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="py-12 text-center text-slate-400">
                                <i data-lucide="alert-circle" class="w-8 h-8 mx-auto mb-2 text-rose-400"></i>
                                ไม่สามารถโหลดข้อมูลบุคลากรได้ กรุณาลองใหม่อีกครั้ง
                            </td>
                        </tr>
                    `;
                }
                const infoEl = document.getElementById("pagination-info");
                if (infoEl) infoEl.innerText = "โหลดข้อมูลไม่สำเร็จ";
                const pagEl = document.getElementById("pagination-controls");
                if (pagEl) pagEl.innerHTML = "";
                if (typeof lucide !== "undefined" && lucide.createIcons) lucide.createIcons();
                if (typeof ui !== "undefined" && ui.showToast) {
                    ui.showToast(err.message || "เกิดข้อผิดพลาดในการโหลดข้อมูล", "error");
                }
            }
        }

        function renderPagination(current, totalPages) {
            const container = document.getElementById("pagination-controls");
            if (!container) return;
            if (totalPages <= 1) {
                container.innerHTML = "";
                return;
            }

            let html = `
                <button type="button" onclick="loadPersonnel(${current - 1})" ${current === 1 ? 'disabled' : ''} 
                    class="px-2.5 py-1.5 border border-slate-200 dark:border-slate-700 rounded-lg text-xs hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed">
                    ก่อนหน้า
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button type="button" onclick="loadPersonnel(${i})" class="w-7 h-7 rounded-lg text-xs font-semibold ${
                        i === current ? 'bg-blue-600 text-white' : 'border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300'
                    }">
                        ${i}
                    </button>
                `;
            }

            html += `
                <button type="button" onclick="loadPersonnel(${current + 1})" ${current === totalPages ? 'disabled' : ''} 
                    class="px-2.5 py-1.5 border border-slate-200 dark:border-slate-700 rounded-lg text-xs hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed">
                    ถัดไป
                </button>
            `;
            container.innerHTML = html;
        }

        function confirmDelete(id, name) {
            if (typeof ui !== "undefined" && ui.confirmModal) {
                ui.confirmModal({
                    title: "ยืนยันการลบข้อมูลบุคลากร",
                    message: `คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลของ "${name}" ? การดำเนินการนี้ไม่สามารถยกเลิกได้`,
                    onConfirm: async () => {
                        try {
                            const res = await apiClient.delete(`/personnel/${id}`);
                            ui.showToast(res.message, "success");
                            loadPersonnel(currentPage);
                        } catch (err) {
                            ui.showToast(err.message, "error");
                        }
                    }
                });
            }
        }

        function exportData(format) {
            const searchEl = document.getElementById("search-input");
            const branchEl = document.getElementById("filter-branch");
            const statusEl = document.getElementById("filter-status");

            const search = searchEl ? searchEl.value.trim() : "";
            const branch_id = branchEl ? branchEl.value : "";
            const work_status = statusEl ? statusEl.value : "";

            const expMenu = document.getElementById("export-menu");
            const expToggle = document.getElementById("export-toggle");
            if (expMenu) expMenu.classList.add("hidden");
            if (expToggle) expToggle.setAttribute("aria-expanded", "false");

            if (typeof ui !== "undefined" && ui.showToast) {
                ui.showToast(`กำลังเตรียมดาวน์โหลดรายงานรูปแบบ ${format.toUpperCase()}...`, "info");
            }
            const ext = format === "excel" ? "xlsx" : format;
            if (typeof apiClient !== "undefined" && apiClient.downloadFile) {
                apiClient.downloadFile("/reports/export", {
                    format,
                    search,
                    branch_id,
                    work_status
                }, `personnel_report_${new Date().toISOString().split('T')[0]}.${ext}`);
            }
        }
    </script>
</body>
</html>
