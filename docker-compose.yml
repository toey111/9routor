services:
  mysql:
    image: mysql:8.0
    container_name: reru_it_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: personnel_db
      MYSQL_USER: personnel_user
      MYSQL_PASSWORD: personnel_pass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - reru_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_123"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reru_it_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=personnel_db
      - DATABASE_USER=personnel_user
      - DATABASE_PASSWORD=personnel_pass123
      - JWT_SECRET=supersecretjwtkey_reru_it_2026_faculty_system
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=*
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - reru_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reru_it_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - reru_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: reru_it_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password_123
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - reru_network

volumes:
  mysql_data:
  backend_uploads:

networks:
  reru_network:
    driver: bridge